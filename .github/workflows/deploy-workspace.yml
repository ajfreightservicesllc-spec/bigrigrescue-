name: Deploy Huntsville Workspaces to Firebase Hosting

on:
  push:
    branches: [main, "claude/business-niches-directory-79ex07"]
    paths:
      - "workspace-source/**"
      - ".github/workflows/deploy-workspace.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build static site
        working-directory: workspace-source
        run: python3 workspace_generator.py

      # Deploy only when the service-account secret exists; otherwise skip with
      # a warning so the build check stays green during initial setup.
      - name: Check deploy credentials
        id: creds
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIANSWERAGENCY_MAIN }}
        run: |
          if [ -n "$FIREBASE_SA" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_AIANSWERAGENCY_MAIN secret not set — site built OK but deploy was skipped. Add the secret (see workspace-source/DEPLOY.md) to enable auto-deploys."
          fi

      - name: Deploy to Firebase Hosting (work-spacehuntsville)
        if: steps.creds.outputs.have == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AIANSWERAGENCY_MAIN }}
          projectId: aiansweragency-main
          channelId: live
          entryPoint: workspace-source
